<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Milestones Map</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .sidebar {
            width: 350px;
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%);
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .sidebar-header {
            padding: 30px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header h1 {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #3498db, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-header p {
            font-size: 14px;
            opacity: 0.8;
            line-height: 1.5;
        }

        .controls-section {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-group h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #ecf0f1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .add-milestone-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }

        .add-milestone-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.4);
        }

        .filter-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .timeline-slider {
            margin: 15px 0;
        }

        .timeline-slider input {
            width: 100%;
            margin: 10px 0;
        }

        .year-display {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #3498db;
            margin-bottom: 10px;
        }

        .category-filters {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .category-btn {
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-btn.active {
            background: #3498db;
            border-color: #2980b9;
            transform: scale(1.05);
        }

        .milestones-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .milestone-item {
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #3498db;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .milestone-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .milestone-item h4 {
            font-size: 14px;
            margin-bottom: 5px;
            color: #ecf0f1;
        }

        .milestone-item p {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .milestone-date {
            font-size: 11px;
            color: #3498db;
            font-weight: bold;
        }

        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%);
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transform: scale(0.7);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .modal.show .modal-content {
            transform: scale(1);
            opacity: 1;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .modal-header h2 {
            color: #2c3e50;
            font-size: 24px;
            font-weight: 300;
        }

        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close:hover {
            color: #e74c3c;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.3);
        }

        .stats-container {
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: center;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 6px;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #3498db;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .custom-marker {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .custom-marker:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .search-container {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 25px;
            font-size: 14px;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
        }

        .export-btn {
            width: 100%;
            padding: 12px;
            background: rgba(155, 89, 182, 0.8);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .export-btn:hover {
            background: rgba(155, 89, 182, 1);
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: 300px;
            }
            
            .map-container {
                flex: 1;
            }
        }

        .popup-content {
            max-width: 250px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .popup-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .popup-description {
            font-size: 14px;
            margin-bottom: 8px;
            color: #34495e;
            line-height: 1.4;
        }

        .popup-date {
            font-size: 12px;
            color: #7f8c8d;
            font-style: italic;
        }

        .popup-category {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1><i class="fas fa-map-marked-alt"></i> Milestones Map</h1>
                <p>Track your life's journey with interactive mapping and timeline visualization</p>
            </div>
            
            <div class="controls-section">
                <div class="control-group">
                    <button class="add-milestone-btn" onclick="openModal()">
                        <i class="fas fa-plus"></i> Add New Milestone
                    </button>
                </div>

                <div class="stats-container">
                    <h3>Journey Statistics</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-number" id="totalMilestones">0</div>
                            <div class="stat-label">Total Milestones</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="countriesVisited">0</div>
                            <div class="stat-label">Countries</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="yearSpan">0</div>
                            <div class="stat-label">Year Span</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="favoriteCategory">-</div>
                            <div class="stat-label">Top Category</div>
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <div class="search-container">
                        <input type="text" class="search-input" id="searchInput" placeholder="Search milestones...">
                        <i class="fas fa-search search-icon"></i>
                    </div>
                </div>

                <div class="control-group">
                    <h3><i class="fas fa-calendar"></i> Timeline Filter</h3>
                    <div class="timeline-slider">
                        <div class="year-display" id="yearDisplay">All Years</div>
                        <input type="range" id="yearSlider" min="1990" max="2024" value="2024" style="width: 100%;">
                        <div style="display: flex; justify-content: space-between; font-size: 12px; opacity: 0.7;">
                            <span>1990</span>
                            <span>2024</span>
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <h3><i class="fas fa-filter"></i> Category Filters</h3>
                    <div class="category-filters">
                        <button class="category-btn active" data-category="all">
                            <i class="fas fa-globe"></i> All
                        </button>
                        <button class="category-btn" data-category="career">
                            <i class="fas fa-briefcase"></i> Career
                        </button>
                        <button class="category-btn" data-category="travel">
                            <i class="fas fa-plane"></i> Travel
                        </button>
                        <button class="category-btn" data-category="education">
                            <i class="fas fa-graduation-cap"></i> Education
                        </button>
                        <button class="category-btn" data-category="personal">
                            <i class="fas fa-heart"></i> Personal
                        </button>
                        <button class="category-btn" data-category="achievement">
                            <i class="fas fa-trophy"></i> Achievement
                        </button>
                    </div>
                </div>

                <div class="control-group">
                    <h3><i class="fas fa-list"></i> Your Milestones</h3>
                    <div class="milestones-list" id="milestonesList"></div>
                </div>

                <button class="export-btn" onclick="exportData()">
                    <i class="fas fa-download"></i> Export Journey Data
                </button>
            </div>
        </div>

        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <!-- Modal -->
    <div id="milestoneModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-map-pin"></i> Add Milestone</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <form id="milestoneForm">
                <div class="form-group">
                    <label for="title">Milestone Title *</label>
                    <input type="text" id="title" required placeholder="e.g., First Job at Adobe">
                </div>
                
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="3" placeholder="Tell us about this milestone..."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="date">Date *</label>
                    <input type="date" id="date" required>
                </div>
                
                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" required>
                        <option value="">Select category...</option>
                        <option value="career">Career</option>
                        <option value="travel">Travel</option>
                        <option value="education">Education</option>
                        <option value="personal">Personal</option>
                        <option value="achievement">Achievement</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="location">Location *</label>
                    <input type="text" id="location" required placeholder="e.g., San Francisco, CA">
                </div>
                
                <button type="submit" class="submit-btn">
                    <i class="fas fa-save"></i> Add Milestone
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script>
        // Global variables
        let map;
        let milestones = [];
        let markers = [];
        let currentFilters = { category: 'all', year: null, search: '' };

        // Category icons and colors
        const categoryConfig = {
            career: { icon: 'fas fa-briefcase', color: '#e74c3c' },
            travel: { icon: 'fas fa-plane', color: '#3498db' },
            education: { icon: 'fas fa-graduation-cap', color: '#9b59b6' },
            personal: { icon: 'fas fa-heart', color: '#e91e63' },
            achievement: { icon: 'fas fa-trophy', color: '#f39c12' }
        };

        // Initialize the application
        function initializeApp() {
            initializeMap();
            setupEventListeners();
            loadSampleData();
            updateStats();
        }

        // Initialize the map
        function initializeMap() {
            map = L.map('map').setView([39.8283, -98.5795], 4);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 18
            }).addTo(map);

            // Add click event to map for adding milestones
            map.on('click', function(e) {
                if (confirm('Add a milestone at this location?')) {
                    const lat = e.latlng.lat.toFixed(6);
                    const lng = e.latlng.lng.toFixed(6);
                    openModal(lat, lng);
                }
            });
        }

        // Setup event listeners
        function setupEventListeners() {
            // Category filter buttons
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilters.category = e.target.dataset.category;
                    applyFilters();
                });
            });

            // Year slider
            const yearSlider = document.getElementById('yearSlider');
            yearSlider.addEventListener('input', (e) => {
                const year = parseInt(e.target.value);
                currentFilters.year = year;
                document.getElementById('yearDisplay').textContent = year;
                applyFilters();
            });

            // Search input
            document.getElementById('searchInput').addEventListener('input', (e) => {
                currentFilters.search = e.target.value.toLowerCase();
                applyFilters();
            });

            // Form submission
            document.getElementById('milestoneForm').addEventListener('submit', handleFormSubmission);
        }

        // Load sample data
        function loadSampleData() {
            const sampleMilestones = [
                {
                    id: 1,
                    title: "Started at Tech Company",
                    description: "Joined as a junior developer, excited for new opportunities",
                    date: "2020-06-15",
                    category: "career",
                    location: "San Francisco, CA",
                    lat: 37.7749,
                    lng: -122.4194
                },
                {
                    id: 2,
                    title: "Graduated University",
                    description: "Completed Computer Science degree with honors",
                    date: "2020-05-20",
                    category: "education",
                    location: "Boston, MA",
                    lat: 42.3601,
                    lng: -71.0589
                },
                {
                    id: 3,
                    title: "First Trip to Europe",
                    description: "Amazing backpacking adventure across 5 countries",
                    date: "2021-08-10",
                    category: "travel",
                    location: "Paris, France",
                    lat: 48.8566,
                    lng: 2.3522
                }
            ];

            milestones = sampleMilestones;
            updateMap();
            updateMilestonesList();
            updateStats();
        }

        // Open modal for adding milestone
        function openModal(lat = null, lng = null) {
            const modal = document.getElementById('milestoneModal');
            modal.style.display = 'block';
            setTimeout(() => modal.classList.add('show'), 10);
            
            if (lat && lng) {
                // Reverse geocode to get location name (simplified)
                document.getElementById('location').value = `${lat}, ${lng}`;
            }
        }

        // Close modal
        function closeModal() {
            const modal = document.getElementById('milestoneModal');
            modal.classList.remove('show');
            setTimeout(() => {
                modal.style.display = 'none';
                document.getElementById('milestoneForm').reset();
            }, 300);
        }

        // Handle form submission
        async function handleFormSubmission(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const milestone = {
                id: Date.now(),
                title: formData.get('title'),
                description: formData.get('description'),
                date: formData.get('date'),
                category: formData.get('category'),
                location: formData.get('location')
            };

            // Geocode the location
            try {
                const coords = await geocodeLocation(milestone.location);
                milestone.lat = coords.lat;
                milestone.lng = coords.lng;
                
                milestones.push(milestone);
                updateMap();
                updateMilestonesList();
                updateStats();
                closeModal();
                
                // Show success message
                alert('Milestone added successfully!');
            } catch (error) {
                alert('Could not find location. Please try a more specific address.');
            }
        }

        // Geocode location using Nominatim
        async function geocodeLocation(location) {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(location)}`);
            const data = await response.json();
            
            if (data && data.length > 0) {
                return {
                    lat: parseFloat(data[0].lat),
                    lng: parseFloat(data[0].lon)
                };
            } else {
                throw new Error('Location not found');
            }
        }

        // Update map with milestones
        function updateMap() {
            // Clear existing markers
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];

            // Add filtered milestones
            const filteredMilestones = getFilteredMilestones();
            
            filteredMilestones.forEach(milestone => {
                const config = categoryConfig[milestone.category];
                
                // Create custom marker
                const markerHtml = `
                    <div class="custom-marker" style="background-color: ${config.color};">
                        <i class="${config.icon}"></i>
                    </div>
                `;

                const marker = L.marker([milestone.lat, milestone.lng], {
                    icon: L.divIcon({
                        html: markerHtml,
                        className: 'custom-div-icon',
                        iconSize: [40, 40],
                        iconAnchor: [20, 20]
                    })
                }).addTo(map);

                // Create popup content
                const popupContent = `
                    <div class="popup-content">
                        <div class="popup-title">${milestone.title}</div>
                        <div class="popup-description">${milestone.description}</div>
                        <div class="popup-date">${formatDate(milestone.date)}</div>
                        <div class="popup-category">${milestone.category}</div>
                    </div>
                `;

                marker.bindPopup(popupContent);
                markers.push(marker);
            });

            // Fit map to markers if any exist
            if (markers.length > 0) {
                const group = new L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.1));
            }
        }

        // Get filtered milestones
        function getFilteredMilestones() {
            return milestones.filter(milestone => {
                // Category filter
                if (currentFilters.category !== 'all' && milestone.category !== currentFilters.category) {
                    return false;
                }

                // Year filter
                if (currentFilters.year) {
                    const milestoneYear = new Date(milestone.date).getFullYear();
                    if (milestoneYear !== currentFilters.year) {
                        return false;
                    }
                }

                // Search filter
                if (currentFilters.search) {
                    const searchTerm = currentFilters.search;
                    if (!milestone.title.toLowerCase().includes(searchTerm) &&
                        !milestone.description.toLowerCase().includes(searchTerm) &&
                        !milestone.location.toLowerCase().includes(searchTerm)) {
                        return false;
                    }
                }

                return true;
            });
        }

        // Apply current filters
        function applyFilters() {
            updateMap();
            updateMilestonesList();
        }

        // Update milestones list in sidebar
        function updateMilestonesList() {
            const container = document.getElementById('milestonesList');
            const filteredMilestones = getFilteredMilestones().sort((a, b) => new Date(b.date) - new Date(a.date));

            if (filteredMilestones.length === 0) {
                container.innerHTML = '<p style="text-align: center; opacity: 0.7; padding: 20px;">No milestones match your filters</p>';
                return;
            }

            container.innerHTML = filteredMilestones.map(milestone => `
                <div class="milestone-item" onclick="focusOnMilestone(${milestone.id})" style="border-left-color: ${categoryConfig[milestone.category].color}">
                    <h4><i class="${categoryConfig[milestone.category].icon}"></i> ${milestone.title}</h4>
                    <p>${milestone.description}</p>
                    <p><i class="fas fa-map-marker-alt"></i> ${milestone.location}</p>
                    <div class="milestone-date">${formatDate(milestone.date)}</div>
                </div>
            `).join('');
        }

        // Focus on specific milestone
        function focusOnMilestone(id) {
            const milestone = milestones.find(m => m.id === id);
            if (milestone) {
                map.setView([milestone.lat, milestone.lng], 10);
                
                // Find and open the popup for this milestone
                const marker = markers.find(m => {
                    const pos = m.getLatLng();
                    return Math.abs(pos.lat - milestone.lat) < 0.001 && Math.abs(pos.lng - milestone.lng) < 0.001;
                });
                
                if (marker) {
                    marker.openPopup();
                }
            }
        }

        // Update statistics
        function updateStats() {
            const totalMilestones = milestones.length;
            
            // Calculate unique countries/locations
            const uniqueLocations = new Set(milestones.map(m => m.location.split(',').pop().trim()));
            
            // Calculate year span
            const years = milestones.map(m => new Date(m.date).getFullYear());
            const yearSpan = years.length > 0 ? Math.max(...years) - Math.min(...years) + 1 : 0;
            
            // Find favorite category
            const categoryCount = {};
            milestones.forEach(m => {
                categoryCount[m.category] = (categoryCount[m.category] || 0) + 1;
            });
            
            const favoriteCategory = Object.keys(categoryCount).reduce((a, b) => 
                categoryCount[a] > categoryCount[b] ? a : b, '-'
            );

            document.getElementById('totalMilestones').textContent = totalMilestones;
            document.getElementById('countriesVisited').textContent = uniqueLocations.size;
            document.getElementById('yearSpan').textContent = yearSpan;
            document.getElementById('favoriteCategory').textContent = 
                favoriteCategory !== '-' ? favoriteCategory.charAt(0).toUpperCase() + favoriteCategory.slice(1) : '-';
        }

        // Format date for display
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

            const exportFileDefaultName = 'my-milestones.json';
            
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);

            if (e.ctrlKey && e.key === 'n') {

                openModal();
            }
            
            // Ctrl+E exports data
            if (e.ctrlKey && e.key === 'e') {
                e.preventDefault();

        // Draw connections between milestones chronologically
        function drawTimelineConnections() {
            const sortedMilestones = [...milestones].sort((a, b) => new Date(a.date) - new Date(b.date));
            
            // Remove existing polylines
            map.eachLayer(layer => {
                if (layer instanceof L.Polyline && layer.options.className === 'timeline-connection') {
                    map.removeLayer(layer);
                }
            });
            
            // Draw connections
            for (let i = 0; i < sortedMilestones.length - 1; i++) {
                const current = sortedMilestones[i];
                const next = sortedMilestones[i + 1];
                
                const line = L.polyline([
                    [current.lat, current.lng],
                    [next.lat, next.lng]
                ], {
                    color: '#3498db',
                    weight: 2,
                    opacity: 0.6,
                    dashArray: '5, 10',
                    className: 'timeline-connection'
                }).addTo(map);
                
                line.bindTooltip(`${formatDate(current.date)} → ${formatDate(next.date)}`, {
                    permanent: false,
                    direction: 'center'
                });
            }
        }

        // Import data functionality
        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            const importedData = JSON.parse(e.target.result);
                            if (Array.isArray(importedData)) {
                                milestones = importedData;
                                updateMap();
                                updateMilestonesList();
                                updateStats();
                                alert('Data imported successfully!');
                            } else {
                                alert('Invalid file format');
                            }
                        } catch (error) {
                            alert('Error reading file');
                        }
                    };
                    reader.readAsText(file);
                }
            };
            
            input.click();
        }

        // Analytics and insights
        function generateInsights() {
            const insights = {
                totalMilestones: milestones.length,
                categoryBreakdown: {},
                yearlyActivity: {},
                mostActiveLocation: null,
                longestGap: 0
            };
            
            // Category breakdown
            milestones.forEach(milestone => {
                insights.categoryBreakdown[milestone.category] = 
                    (insights.categoryBreakdown[milestone.category] || 0) + 1;
            });
            
            // Yearly activity
            milestones.forEach(milestone => {
                const year = new Date(milestone.date).getFullYear();
                insights.yearlyActivity[year] = (insights.yearlyActivity[year] || 0) + 1;
            });
            
            // Most active location
            const locationCount = {};
            milestones.forEach(milestone => {
                const location = milestone.location;
                locationCount[location] = (locationCount[location] || 0) + 1;
            });
            
            insights.mostActiveLocation = Object.keys(locationCount).reduce((a, b) => 
                locationCount[a] > locationCount[b] ? a : b, null
            );
            
            return insights;
        }

        // Accessibility improvements
        function initializeAccessibility() {
            // Add ARIA labels
            document.querySelectorAll('button').forEach(btn => {
                if (!btn.getAttribute('aria-label')) {
                    btn.setAttribute('aria-label', btn.textContent);
                }
            });
            
            // Keyboard navigation for map
            map.getContainer().setAttribute('tabindex', '0');
            map.getContainer().addEventListener('keydown', function(e) {
                const step = 0.01;
                const center = map.getCenter();
                
                switch(e.key) {
                    case 'ArrowUp':
                        map.panTo([center.lat + step, center.lng]);
                        break;
                    case 'ArrowDown':
                        map.panTo([center.lat - step, center.lng]);
                        break;
                    case 'ArrowLeft':
                        map.panTo([center.lat, center.lng - step]);
                        break;
                    case 'ArrowRight':
                        map.panTo([center.lat, center.lng + step]);
                        break;
                }
            });
        }
