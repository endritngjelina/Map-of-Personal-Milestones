<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeJourney - Personal Milestones Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css" />
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            --primary-light: rgba(102, 126, 234, 0.1);
            --secondary-light: rgba(118, 75, 162, 0.1);
            --accent-light: rgba(240, 147, 251, 0.1);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 15px 50px rgba(0, 0, 0, 0.2);
            --border-radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--primary-gradient);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            overflow: hidden;
            height: 100vh;
            color: var(--text-primary);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app-container {
            display: flex;
            height: 100vh;
            backdrop-filter: blur(10px);
        }

        /* Sidebar Styles */
        .sidebar {
            width: 380px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        .sidebar-header {
            padding: 32px 24px;
            background: var(--primary-gradient);
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .sidebar-header h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .sidebar-header p {
            font-size: 15px;
            opacity: 0.95;
            position: relative;
            z-index: 1;
            font-weight: 500;
        }

        .controls-section {
            padding: 24px;
            border-bottom: 1px solid rgba(229, 229, 231, 0.3);
            background: rgba(255, 255, 255, 0.02);
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .add-milestone-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .add-milestone-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .timeline-filters, .category-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .filter-btn, .category-btn {
            padding: 8px 16px;
            border: 2px solid rgba(229, 229, 231, 0.6);
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-btn.active, .category-btn.active {
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
            transform: scale(1.05);
            box-shadow: var(--shadow-sm);
        }

        .category-filters {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .category-btn {
            padding: 12px 8px;
            border-radius: 12px;
            text-align: center;
        }

        .milestones-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 20px;
        }

        .milestone-item {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .milestone-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(102, 126, 234, 0.2);
        }

        .milestone-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .milestone-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .milestone-title {
            font-weight: 700;
            font-size: 17px;
            margin-bottom: 2px;
        }

        .milestone-date {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .milestone-description {
            font-size: 14px;
            color: #424245;
            margin-top: 10px;
            line-height: 1.5;
        }

        .milestone-location {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, #ff3b30, #ff6b6b);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 12px;
            opacity: 0;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .milestone-item:hover .delete-btn {
            opacity: 1;
        }

        .stats-section {
            padding: 24px;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary-light), var(--accent-light));
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .stat-item {
            text-align: center;
            padding: 16px;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: var(--transition);
        }

        .stat-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .stat-number {
            font-size: 28px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Map Container */
        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .map-control-btn {
            width: 52px;
            height: 52px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--text-primary);
            transition: var(--transition);
        }

        .map-control-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: var(--shadow-lg);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            opacity: 1;
        }

        .modal-content {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            margin: 3% auto;
            padding: 40px;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 520px;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
            transform: translateY(20px);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal.show .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 16px;
            border: 2px solid rgba(229, 229, 231, 0.6);
            border-radius: 12px;
            font-size: 16px;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.15);
        }

        .location-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #e5e5e7;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .location-suggestion {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #f5f5f7;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: rgba(245, 245, 247, 0.9);
            color: var(--text-primary);
        }

        /* Animations */
        .pulse-animation {
            animation: advancedPulse 2s infinite;
        }

        @keyframes advancedPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Responsive Design */
        @media (max-width: 968px) {
            .app-container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: 40vh;
            }
            
            .map-container {
                height: 60vh;
            }
            
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 768px) {
            .sidebar-header {
                padding: 20px;
            }
            
            .sidebar-header h1 {
                font-size: 24px;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .modal-content {
                margin: 10% auto;
                padding: 24px;
            }
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: var(--shadow-md);
            border-left: 4px solid #667eea;
            z-index: 10001;
            transform: translateX(400px);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-success {
            border-left-color: #34c759;
        }

        .toast-error {
            border-left-color: #ff3b30;
        }

        /* Loading animation */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* Custom scrollbar */
        .milestones-list::-webkit-scrollbar {
            width: 6px;
        }

        .milestones-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }

        .milestones-list::-webkit-scrollbar-thumb {
            background: var(--primary-gradient);
            border-radius: 10px;
        }

        /* Enhanced marker clusters */
        .marker-cluster-small {
            background-color: rgba(102, 126, 234, 0.6);
        }

        .marker-cluster-small div {
            background-color: rgba(102, 126, 234, 0.8);
        }

        /* Timeline view */
        .timeline-view {
            display: none;
            padding: 20px;
        }

        .timeline-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }

        /* View toggle button */
        .view-toggle {
            display: flex;
            background: var(--card-bg);
            border-radius: 25px;
            padding: 4px;
            margin-bottom: 16px;
        }

        .view-toggle-btn {
            padding: 8px 16px;
            border: none;
            background: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: var(--transition);
        }

        .view-toggle-btn.active {
            background: var(--primary-gradient);
            color: white;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>LifeJourney</h1>
                <p>Map your personal milestones</p>
            </div>
            
            <div class="controls-section">
                <div class="view-toggle">
                    <button class="view-toggle-btn active" data-view="map">Map View</button>
                    <button class="view-toggle-btn" data-view="timeline">Timeline</button>
                </div>
                
                <div class="control-group">
                    <button class="add-milestone-btn" id="addMilestoneBtn">
                        <i class="fas fa-plus"></i>
                        Add New Milestone
                    </button>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Timeline Filters</label>
                    <div class="timeline-filters">
                        <button class="filter-btn active" data-period="all">All Time</button>
                        <button class="filter-btn" data-period="year">This Year</button>
                        <button class="filter-btn" data-period="5years">Last 5 Years</button>
                        <button class="filter-btn" data-period="decade">Last Decade</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Categories</label>
                    <div class="category-filters">
                        <button class="category-btn active" data-category="all">All</button>
                        <button class="category-btn" data-category="career">Career</button>
                        <button class="category-btn" data-category="education">Education</button>
                        <button class="category-btn" data-category="travel">Travel</button>
                        <button class="category-btn" data-category="personal">Personal</button>
                        <button class="category-btn" data-category="achievement">Achievement</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Search</label>
                    <input type="text" id="searchInput" placeholder="Search milestones..." class="form-group input">
                </div>
            </div>
            
            <div class="milestones-list" id="milestonesList">
                <!-- Milestones will be populated here -->
            </div>
            
            <div class="stats-section">
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-number" id="totalMilestones">0</div>
                        <div class="stat-label">Total Milestones</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="countriesVisited">0</div>
                        <div class="stat-label">Countries</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="thisYearCount">0</div>
                        <div class="stat-label">This Year</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="averagePerYear">0</div>
                        <div class="stat-label">Avg/Year</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="map-container">
            <div id="map"></div>
            <div class="map-controls">
                <button class="map-control-btn" id="centerMapBtn" title="Center Map">
                    <i class="fas fa-crosshairs"></i>
                </button>
                <button class="map-control-btn" id="fullscreenBtn" title="Fullscreen">
                    <i class="fas fa-expand"></i>
                </button>
                <button class="map-control-btn" id="exportBtn" title="Export Data">
                    <i class="fas fa-download"></i>
                </button>
                <button class="map-control-btn" id="importBtn" title="Import Data">
                    <i class="fas fa-upload"></i>
                </button>
            </div>
        </div>

        <div class="timeline-view" id="timelineView">
            <div class="timeline-container" id="timelineContainer">
                <!-- Timeline will be rendered here -->
            </div>
        </div>
    </div>

    <!-- Add Milestone Modal -->
    <div id="milestoneModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Milestone</h2>
                <p>Create a memory that matters</p>
            </div>
            
            <form id="milestoneForm">
                <div class="form-group">
                    <label for="milestoneTitle">Title *</label>
                    <input type="text" id="milestoneTitle" required placeholder="e.g., First Job at Google">
                </div>
                
                <div class="form-group">
                    <label for="milestoneCategory">Category *</label>
                    <select id="milestoneCategory" required>
                        <option value="">Select a category</option>
                        <option value="career">Career</option>
                        <option value="education">Education</option>
                        <option value="travel">Travel</option>
                        <option value="personal">Personal</option>
                        <option value="achievement">Achievement</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="milestoneDate">Date *</label>
                    <input type="date" id="milestoneDate" required>
                </div>
                
                <div class="form-group">
                    <label for="milestoneLocation">Location *</label>
                    <div class="location-input">
                        <input type="text" id="milestoneLocation" required placeholder="e.g., Mountain View, California">
                        <div class="location-suggestions" id="locationSuggestions"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="milestoneDescription">Description</label>
                    <textarea id="milestoneDescription" placeholder="Share your story..."></textarea>
                </div>

                <div class="form-group">
                    <label for="milestoneImage">Upload Image</label>
                    <input type="file" id="milestoneImage" accept="image/*">
                </div>
                
                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Milestone</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Milestone Modal -->
    <div id="editMilestoneModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Milestone</h2>
                <p>Update your memory</p>
            </div>
            
            <form id="editMilestoneForm">
                <input type="hidden" id="editMilestoneId">
                <div class="form-group">
                    <label for="editMilestoneTitle">Title *</label>
                    <input type="text" id="editMilestoneTitle" required>
                </div>
                
                <div class="form-group">
                    <label for="editMilestoneCategory">Category *</label>
                    <select id="editMilestoneCategory" required>
                        <option value="career">Career</option>
                        <option value="education">Education</option>
                        <option value="travel">Travel</option>
                        <option value="personal">Personal</option>
                        <option value="achievement">Achievement</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="editMilestoneDate">Date *</label>
                    <input type="date" id="editMilestoneDate" required>
                </div>
                
                <div class="form-group">
                    <label for="editMilestoneLocation">Location *</label>
                    <div class="location-input">
                        <input type="text" id="editMilestoneLocation" required>
                        <div class="location-suggestions" id="editLocationSuggestions"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="editMilestoneDescription">Description</label>
                    <textarea id="editMilestoneDescription"></textarea>
                </div>
                
                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" id="editCancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Update Milestone</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Main Application Class
        class LifeJourneyApp {
            constructor() {
                this.milestones = this.loadMilestones();
                this.map = null;
                this.markers = new Map();
                this.markerCluster = null;
                this.activeFilters = {
                    period: 'all',
                    category: 'all',
                    search: ''
                };
                this.currentView = 'map';
                
                this.categoryIcons = {
                    career: { icon: 'fas fa-briefcase', color: '#667eea' },
                    education: { icon: 'fas fa-graduation-cap', color: '#764ba2' },
                    travel: { icon: 'fas fa-plane', color: '#f093fb' },
                    personal: { icon: 'fas fa-heart', color: '#ff6b6b' },
                    achievement: { icon: 'fas fa-trophy', color: '#feca57' }
                };
                
                this.init();
            }
            
            init() {
                this.initMap();
                this.initEventListeners();
                this.renderMilestones();
                this.updateStats();
                
                // Load sample data if no milestones exist
                if (this.milestones.length === 0) {
                    this.loadSampleData();
                }
            }
            
            initMap() {
                // Initialize the map
                this.map = L.map('map', {
                    zoomControl: false,
                    preferCanvas: true // Better performance with many markers
                }).setView([20, 0], 2);
                
                // Add tile layer
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    maxZoom: 19
                }).addTo(this.map);
                
                // Add zoom control
                L.control.zoom({
                    position: 'bottomright'
                }).addTo(this.map);
                
                // Initialize marker cluster group
                this.markerCluster = L.markerClusterGroup({
                    chunkedLoading: true,
                    maxClusterRadius: 40
                });
                this.map.addLayer(this.markerCluster);
            }
            
            initEventListeners() {
                // Add milestone button
                document.getElementById('addMilestoneBtn').addEventListener('click', () => {
                    this.showModal();
                });
                
                // Modal events
                document.getElementById('cancelBtn').addEventListener('click', () => {
                    this.hideModal();
                });
                
                document.getElementById('editCancelBtn').addEventListener('click', () => {
                    this.hideEditModal();
                });
                
                document.getElementById('milestoneForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.addMilestone();
                });
                
                document.getElementById('editMilestoneForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.updateMilestone();
                });
                
                // Filter events
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.activeFilters.period = e.target.dataset.period;
                        this.applyFilters();
                    });
                });
                
                document.querySelectorAll('.category-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.activeFilters.category = e.target.dataset.category;
                        this.applyFilters();
                    });
                });
                
                // Search input
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.activeFilters.search = e.target.value.toLowerCase();
                    this.applyFilters();
                });
                
                // View toggle
                document.querySelectorAll('.view-toggle-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.view-toggle-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.switchView(e.target.dataset.view);
                    });
                });
                
                // Location input with suggestions
                document.getElementById('milestoneLocation').addEventListener('input', (e) => {
                    this.searchLocations(e.target.value, 'locationSuggestions');
                });
                
                document.getElementById('editMilestoneLocation').addEventListener('input', (e) => {
                    this.searchLocations(e.target.value, 'editLocationSuggestions');
                });
                
                // Map controls
                document.getElementById('centerMapBtn').addEventListener('click', () => {
                    this.centerMap();
                });
                
                document.getElementById('fullscreenBtn').addEventListener('click', () => {
                    this.toggleFullscreen();
                });
                
                document.getElementById('exportBtn').addEventListener('click', () => {
                    this.exportData();
                });
                
                document.getElementById('importBtn').addEventListener('click', () => {
                    document.getElementById('importFile').click();
                });
                
                // Import file handling
                document.getElementById('importFile').addEventListener('change', (e) => {
                    this.importData(e.target.files[0]);
                });
                
                // Close modals on outside click
                document.getElementById('milestoneModal').addEventListener('click', (e) => {
                    if (e.target.id === 'milestoneModal') {
                        this.hideModal();
                    }
                });
                
                document.getElementById('editMilestoneModal').addEventListener('click', (e) => {
                    if (e.target.id === 'editMilestoneModal') {
                        this.hideEditModal();
                    }
                });
                
                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.hideModal();
                        this.hideEditModal();
                    }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                        e.preventDefault();
                        this.showModal();
                    }
                });
                
                // Handle window resize
                window.addEventListener('resize', () => {
                    setTimeout(() => {
                        this.map.invalidateSize();
                    }, 100);
                });
            }
            
            switchView(view) {
                this.currentView = view;
                
                if (view === 'map') {
                    document.getElementById('map').style.display = 'block';
                    document.getElementById('timelineView').style.display = 'none';
                } else {
                    document.getElementById('map').style.display = 'none';
                    document.getElementById('timelineView').style.display = 'block';
                    this.renderTimeline();
                }
            }
            
            renderTimeline() {
                const container = document.getElementById('timelineContainer');
                const filteredMilestones = this.getFilteredMilestones();
                
                // Sort by date (oldest first for timeline)
                const sortedMilestones = [...filteredMilestones].sort((a, b) => 
                    new Date(a.date) - new Date(b.date)
                );
                
                container.innerHTML = '';
                
                if (sortedMilestones.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
                            <i class="fas fa-inbox" style="font-size: 48px; margin-bottom: 16px;"></i>
                            <p>No milestones found for the current filters</p>
                        </div>
                    `;
                    return;
                }
                
                sortedMilestones.forEach(milestone => {
                    const categoryInfo = this.categoryIcons[milestone.category];
                    const date = new Date(milestone.date);
                    
                    const timelineItem = document.createElement('div');
                    timelineItem.className = 'milestone-item';
                    timelineItem.innerHTML = `
                        <div class="milestone-header">
                            <div class="milestone-icon" style="background: ${categoryInfo.color}">
                                <i class="${categoryInfo.icon}"></i>
                            </div>
                            <div>
                                <div class="milestone-title">${milestone.title}</div>
                                <div class="milestone-date">${date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
                            </div>
                        </div>
                        ${milestone.description ? `<div class="milestone-description">${milestone.description}</div>` : ''}
                        <div class="milestone-location">
                            <i class="fas fa-map-marker-alt"></i>
                            ${milestone.location}
                        </div>
                        <div style="display: flex; gap: 8px; margin-top: 12px;">
                            <button class="edit-btn" data-id="${milestone.id}">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="delete-btn" data-id="${milestone.id}">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    `;
                    
                    // Add event listeners for edit and delete
                    timelineItem.querySelector('.edit-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.showEditModal(milestone.id);
                    });
                    
                    timelineItem.querySelector('.delete-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.deleteMilestone(milestone.id);
                    });
                    
                    container.appendChild(timelineItem);
                });
            }
            
            showModal() {
                const modal = document.getElementById('milestoneModal');
                modal.style.display = 'block';
                setTimeout(() => modal.classList.add('show'), 10);
                document.getElementById('milestoneTitle').focus();
                
                // Set default date to today
                document.getElementById('milestoneDate').valueAsDate = new Date();
            }
            
            hideModal() {
                const modal = document.getElementById('milestoneModal');
                modal.classList.remove('show');
                setTimeout(() => {
                    modal.style.display = 'none';
                    document.getElementById('milestoneForm').reset();
                    this.hideSuggestions('locationSuggestions');
                }, 300);
            }
            
            showEditModal(id) {
                const milestone = this.milestones.find(m => m.id === id);
                if (!milestone) return;
                
                document.getElementById('editMilestoneId').value = milestone.id;
                document.getElementById('editMilestoneTitle').value = milestone.title;
                document.getElementById('editMilestoneCategory').value = milestone.category;
                document.getElementById('editMilestoneDate').value = milestone.date;
                document.getElementById('editMilestoneLocation').value = milestone.location;
                document.getElementById('editMilestoneDescription').value = milestone.description || '';
                
                const modal = document.getElementById('editMilestoneModal');
                modal.style.display = 'block';
                setTimeout(() => modal.classList.add('show'), 10);
            }
            
            hideEditModal() {
                const modal = document.getElementById('editMilestoneModal');
                modal.classList.remove('show');
                setTimeout(() => {
                    modal.style.display = 'none';
                    this.hideSuggestions('editLocationSuggestions');
                }, 300);
            }
            
            async addMilestone() {
                const title = document.getElementById('milestoneTitle').value;
                const category = document.getElementById('milestoneCategory').value;
                const date = document.getElementById('milestoneDate').value;
                const location = document.getElementById('milestoneLocation').value;
                const description = document.getElementById('milestoneDescription').value;
                const imageFile = document.getElementById('milestoneImage').files[0];
                
                if (!title || !category || !date || !location) {
                    this.showToast('Please fill all required fields', 'error');
                    return;
                }
                
                try {
                    const coords = await this.geocodeLocation(location);
                    
                    // Handle image upload if exists
                    let imageData = null;
                    if (imageFile) {
                        imageData = await this.readFileAsDataURL(imageFile);
                    }
                    
                    const milestone = {
                        id: Date.now().toString(),
                        title,
                        category,
                        date,
                        location,
                        description,
                        coordinates: coords,
                        image: imageData,
                        createdAt: new Date().toISOString()
                    };
                    
                    this.milestones.push(milestone);
                    this.saveMilestones();
                    this.renderMilestones();
                    this.updateStats();
                    this.addMarker(milestone);
                    this.hideModal();
                    
                    this.showToast('Milestone added successfully!', 'success');
                    
                    // Animate to new marker
                    this.map.flyTo(coords, 8, {
                        animate: true,
                        duration: 1.5
                    });
                    
                } catch (error) {
                    this.showToast('Could not find location. Please try a different address.', 'error');
                }
            }
            
            async updateMilestone() {
                const id = document.getElementById('editMilestoneId').value;
                const title = document.getElementById('editMilestoneTitle').value;
                const category = document.getElementById('editMilestoneCategory').value;
                const date = document.getElementById('editMilestoneDate').value;
                const location = document.getElementById('editMilestoneLocation').value;
                const description = document.getElementById('editMilestoneDescription').value;
                
                if (!title || !category || !date || !location) {
                    this.showToast('Please fill all required fields', 'error');
                    return;
                }
                
                try {
                    const coords = await this.geocodeLocation(location);
                    
                    const index = this.milestones.findIndex(m => m.id === id);
                    if (index === -1) return;
                    
                    this.milestones[index] = {
                        ...this.milestones[index],
                        title,
                        category,
                        date,
                        location,
                        description,
                        coordinates: coords
                    };
                    
                    this.saveMilestones();
                    this.renderMilestones();
                    this.updateStats();
                    this.hideEditModal();
                    
                    this.showToast('Milestone updated successfully!', 'success');
                    
                } catch (error) {
                    this.showToast('Could not find location. Please try a different address.', 'error');
                }
            }
            
            readFileAsDataURL(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }
            
            async geocodeLocation(location) {
                // Use a more reliable geocoding service with better rate limits
                const response = await fetch(`https://api.geoapify.com/v1/geocode/search?text=${encodeURIComponent(location)}&apiKey=YOUR_GEOAPIFY_KEY`);
                const data = await response.json();
                
                if (data && data.features && data.features.length > 0) {
                    return [data.features[0].properties.lat, data.features[0].properties.lon];
                } else {
                    throw new Error('Location not found');
                }
            }
            
            async searchLocations(query, suggestionId) {
                if (query.length < 3) {
                    this.hideSuggestions(suggestionId);
                    return;
                }
                
                try {
                    const response = await fetch(`https://api.geoapify.com/v1/geocode/autocomplete?text=${encodeURIComponent(query)}&apiKey=YOUR_GEOAPIFY_KEY&limit=5`);
                    const data = await response.json();
                    this.showSuggestions(data.features, suggestionId);
                } catch (error) {
                    this.hideSuggestions(suggestionId);
                }
            }
            
            showSuggestions(suggestions, suggestionId) {
                const container = document.getElementById(suggestionId);
                container.innerHTML = '';
                
                if (!suggestions || suggestions.length === 0) {
                    this.hideSuggestions(suggestionId);
                    return;
                }
                
                suggestions.forEach(suggestion => {
                    const div = document.createElement('div');
                    div.className = 'location-suggestion';
                    div.textContent = suggestion.properties.formatted;
                    div.addEventListener('click', () => {
                        const inputId = suggestionId === 'locationSuggestions' ? 'milestoneLocation' : 'editMilestoneLocation';
                        document.getElementById(inputId).value = suggestion.properties.formatted;
                        this.hideSuggestions(suggestionId);
                    });
                    container.appendChild(div);
                });
                
                container.style.display = 'block';
            }
            
            hideSuggestions(suggestionId) {
                document.getElementById(suggestionId).style.display = 'none';
            }
            
            renderMilestones() {
                const container = document.getElementById('milestonesList');
                const filteredMilestones = this.getFilteredMilestones();
                
                // Show loading skeleton while rendering
                container.innerHTML = `
                    <div class="milestone-item">
                        <div class="milestone-header">
                            <div class="milestone-icon skeleton" style="border-radius: 50%;"></div>
                            <div style="flex: 1;">
                                <div class="skeleton" style="height: 20px; width: 70%; margin-bottom: 8px;"></div>
                                <div class="skeleton" style="height: 14px; width: 50%;"></div>
                            </div>
                        </div>
                    </div>
                    <div class="milestone-item">
                        <div class="milestone-header">
                            <div class="milestone-icon skeleton" style="border-radius: 50%;"></div>
                            <div style="flex: 1;">
                                <div class="skeleton" style="height: 20px; width: 70%; margin-bottom: 8px;"></div>
                                <div class="skeleton" style="height: 14px; width: 50%;"></div>
                            </div>
                        </div>
                    </div>
                `;
                
                // Use setTimeout to allow the skeleton to render before doing the heavy work
                setTimeout(() => {
                    container.innerHTML = '';
                    
                    if (filteredMilestones.length === 0) {
                        container.innerHTML = `
                            <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
                                <i class="fas fa-inbox" style="font-size: 48px; margin-bottom: 16px;"></i>
                                <p>No milestones found for the current filters</p>
                            </div>
                        `;
                        this.updateMapMarkers();
                        return;
                    }
                    
                    filteredMilestones.forEach(milestone => {
                        const item = this.createMilestoneItem(milestone);
                        container.appendChild(item);
                    });
                    
                    this.updateMapMarkers();
                    
                    // If in timeline view, update it too
                    if (this.currentView === 'timeline') {
                        this.renderTimeline();
                    }
                }, 50);
            }
            
            createMilestoneItem(milestone) {
                const div = document.createElement('div');
                div.className = 'milestone-item';
                div.setAttribute('data-id', milestone.id);
                
                const categoryInfo = this.categoryIcons[milestone.category];
                const date = new Date(milestone.date);
                
                div.innerHTML = `
                    <div class="milestone-header">
                        <div class="milestone-icon" style="background: ${categoryInfo.color}">
                            <i class="${categoryInfo.icon}"></i>
                        </div>
                        <div>
                            <div class="milestone-title">${milestone.title}</div>
                            <div class="milestone-date">${date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
                        </div>
                    </div>
                    ${milestone.description ? `<div class="milestone-description">${milestone.description}</div>` : ''}
                    ${milestone.image ? `<div style="margin-top: 12px;"><img src="${milestone.image}" style="width: 100%; border-radius: 8px;"></div>` : ''}
                    <div class="milestone-location">
                        <i class="fas fa-map-marker-alt"></i>
                        ${milestone.location}
                    </div>
                    <button class="delete-btn" onclick="app.deleteMilestone('${milestone.id}')">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                
                div.addEventListener('click', (e) => {
                    if (!e.target.closest('.delete-btn')) {
                        this.flyToMilestone(milestone);
                    }
                });
                
                return div;
            }
            
            getFilteredMilestones() {
                let filtered = [...this.milestones];
                
                // Apply period filter
                if (this.activeFilters.period !== 'all') {
                    const now = new Date();
                    const cutoff = new Date();
                    
                    switch (this.activeFilters.period) {
                        case 'year':
                            cutoff.setFullYear(now.getFullYear() - 1);
                            break;
                        case '5years':
                            cutoff.setFullYear(now.getFullYear() - 5);
                            break;
                        case 'decade':
                            cutoff.setFullYear(now.getFullYear() - 10);
                            break;
                    }
                    
                    filtered = filtered.filter(m => new Date(m.date) >= cutoff);
                }
                
                // Apply category filter
                if (this.activeFilters.category !== 'all') {
                    filtered = filtered.filter(m => m.category === this.activeFilters.category);
                }
                
                // Apply search filter
                if (this.activeFilters.search) {
                    filtered = filtered.filter(m => 
                        m.title.toLowerCase().includes(this.activeFilters.search) ||
                        m.description.toLowerCase().includes(this.activeFilters.search) ||
                        m.location.toLowerCase().includes(this.activeFilters.search)
                    );
                }
                
                // Sort by date (newest first)
                filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                return filtered;
            }
            
            applyFilters() {
                this.renderMilestones();
                this.updateStats();
            }
            
            updateMapMarkers() {
                // Clear existing markers
                this.markerCluster.clearLayers();
                this.markers.clear();
                
                // Add filtered markers
                const filteredMilestones = this.getFilteredMilestones();
                filteredMilestones.forEach(milestone => {
                    this.addMarker(milestone);
                });
            }
            
            addMarker(milestone) {
                const categoryInfo = this.categoryIcons[milestone.category];
                
                // Create custom icon
                const customIcon = L.divIcon({
                    className: 'custom-marker',
                    html: `
                        <div style="
                            width: 40px; 
                            height: 40px; 
                            background: ${categoryInfo.color}; 
                            border-radius: 50%; 
                            display: flex; 
                            align-items: center; 
                            justify-content: center; 
                            color: white; 
                            font-size: 16px;
                            border: 3px solid white;
                            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
                        ">
                            <i class="${categoryInfo.icon}"></i>
                        </div>
                    `,
                    iconSize: [40, 40],
                    iconAnchor: [20, 20]
                });
                
                const marker = L.marker(milestone.coordinates, { 
                    icon: customIcon 
                });
                
                // Create popup content
                const popupContent = `
                    <div class="custom-popup">
                        <div class="popup-title">${milestone.title}</div>
                        <div class="popup-date">${new Date(milestone.date).toLocaleDateString()}</div>
                        ${milestone.description ? `<div style="margin-top: 8px; font-size: 12px; color: #424245;">${milestone.description}</div>` : ''}
                        ${milestone.image ? `<div style="margin-top: 12px;"><img src="${milestone.image}" style="width: 100%; border-radius: 8px;"></div>` : ''}
                    </div>
                `;
                
                marker.bindPopup(popupContent, {
                    closeButton: true,
                    autoClose: false,
                    className: 'custom-popup-wrapper',
                    maxWidth: 300
                });
                
                // Add to cluster group
                this.markerCluster.addLayer(marker);
                this.markers.set(milestone.id, marker);
            }
            
            flyToMilestone(milestone) {
                this.map.flyTo(milestone.coordinates, 12, {
                    animate: true,
                    duration: 1.5
                });
                
                const marker = this.markers.get(milestone.id);
                if (marker) {
                    setTimeout(() => {
                        marker.openPopup();
                        marker.getElement().classList.add('pulse-animation');
                        setTimeout(() => {
                            marker.getElement().classList.remove('pulse-animation');
                        }, 2000);
                    }, 1500);
                }
            }
            
            deleteMilestone(id) {
                if (confirm('Are you sure you want to delete this milestone?')) {
                    // Remove from array
                    this.milestones = this.milestones.filter(m => m.id !== id);
                    
                    // Remove marker from map
                    const marker = this.markers.get(id);
                    if (marker) {
                        this.markerCluster.removeLayer(marker);
                        this.markers.delete(id);
                    }
                    
                    this.saveMilestones();
                    this.renderMilestones();
                    this.updateStats();
                    this.showToast('Milestone deleted successfully', 'success');
                }
            }
            
            showToast(message, type = 'info') {
                // Remove existing toast
                const existingToast = document.querySelector('.toast');
                if (existingToast) {
                    existingToast.remove();
                }
                
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                        <span>${message}</span>
                    </div>
                `;
                
                document.body.appendChild(toast);
                
                setTimeout(() => toast.classList.add('show'), 100);
                
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
            
            centerMap() {
                if (this.milestones.length === 0) {
                    this.map.setView([20, 0], 2);
                    return;
                }
                
                const filteredMilestones = this.getFilteredMilestones();
                if (filteredMilestones.length === 0) {
                    this.map.setView([20, 0], 2);
                    return;
                }
                
                // Create a group of all visible markers
                const group = L.featureGroup(
                    filteredMilestones
                        .map(m => this.markers.get(m.id))
                        .filter(marker => marker !== undefined)
                );
                
                this.map.fitBounds(group.getBounds().pad(0.1), {
                    animate: true,
                    duration: 1.5
                });
            }
            
            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                    document.getElementById('fullscreenBtn').innerHTML = '<i class="fas fa-compress"></i>';
                } else {
                    document.exitFullscreen();
                    document.getElementById('fullscreenBtn').innerHTML = '<i class="fas fa-expand"></i>';
                }
            }
            
            exportData() {
                const data = {
                    milestones: this.milestones,
                    exportDate: new Date().toISOString(),
                    version: '2.0'
                };
                
                const blob = new Blob([JSON.stringify(data, null, 2)], {
                    type: 'application/json'
                });
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `lifejourney-export-${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                this.showToast('Data exported successfully!', 'success');
            }
            
            importData(file) {
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        
                        if (data.milestones && Array.isArray(data.milestones)) {
                            this.milestones = data.milestones;
                            this.saveMilestones();
                            this.renderMilestones();
                            this.updateStats();
                            this.showToast('Data imported successfully!', 'success');
                        } else {
                            this.showToast('Invalid file format', 'error');
                        }
                    } catch (error) {
                        this.showToast('Error parsing file', 'error');
                    }
                };
                reader.readAsText(file);
            }
            
            updateStats() {
                const total = this.milestones.length;
                const filtered = this.getFilteredMilestones();
                
                // Countries visited
                const countries = new Set();
                this.milestones.forEach(m => {
                    const locationParts = m.location.split(',');
                    if (locationParts.length > 0) {
                        countries.add(locationParts[locationParts.length - 1].trim());
                    }
                });
                
                // This year count
                const thisYear = new Date().getFullYear();
                const thisYearMilestones = this.milestones.filter(m => 
                    new Date(m.date).getFullYear() === thisYear
                );
                
                // Average per year
                const years = new Set(this.milestones.map(m => 
                    new Date(m.date).getFullYear()
                ));
                const averagePerYear = years.size > 0 ? (total / years.size).toFixed(1) : 0;
                
                document.getElementById('totalMilestones').textContent = total;
                document.getElementById('countriesVisited').textContent = countries.size;
                document.getElementById('thisYearCount').textContent = thisYearMilestones.length;
                document.getElementById('averagePerYear').textContent = averagePerYear;
            }
            
            loadMilestones() {
                try {
                    const stored = localStorage.getItem('lifejourney-milestones');
                    return stored ? JSON.parse(stored) : [];
                } catch (e) {
                    console.error('Error loading milestones from storage', e);
                    return [];
                }
            }
            
            saveMilestones() {
                try {
                    localStorage.setItem('lifejourney-milestones', JSON.stringify(this.milestones));
                } catch (e) {
                    console.error('Error saving milestones to storage', e);
                    this.showToast('Error saving data', 'error');
                }
            }

        // Initialize the application
