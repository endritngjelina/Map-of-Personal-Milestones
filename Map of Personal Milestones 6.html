<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Milestones Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            position: relative;
        }

        .sidebar {
            width: 350px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border-right: 1px solid rgba(255, 255, 255, 0.18);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar.collapsed {
            transform: translateX(-300px);
        }

        .sidebar-toggle {
            position: absolute;
            right: -50px;
            top: 20px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            transition: all 0.3s ease;
        }

        .sidebar-toggle:hover {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.05);
        }

        .header {
            padding: 20px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.9em;
        }

        .controls {
            padding: 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
            font-size: 0.9em;
        }

        .input-group {
            position: relative;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 0.9em;
            transition: all 0.3s ease;
            background: white;
        }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9em;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #495057;
            border: 1px solid #dee2e6;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .filters {
            padding: 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .chip {
            background: #e9ecef;
            color: #495057;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .chip.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .chip:hover {
            transform: scale(1.05);
        }

        .timeline-filter {
            margin-top: 15px;
        }

        .year-range {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .year-range input[type="range"] {
            flex: 1;
            accent-color: #667eea;
        }

        .year-display {
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 600;
            min-width: 80px;
            text-align: center;
            border: 1px solid #dee2e6;
        }

        .milestones-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .milestone-item {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .milestone-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .milestone-header {
            display: flex;
            align-items: center;
            justify-content: between;
            margin-bottom: 8px;
        }

        .milestone-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 14px;
            color: white;
        }

        .milestone-content h4 {
            color: #333;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .milestone-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.8em;
            color: #666;
            margin-bottom: 8px;
        }

        .milestone-description {
            color: #555;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .milestone-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 4px 8px;
            font-size: 0.75em;
            border-radius: 4px;
        }

        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .stats-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            z-index: 1000;
            min-width: 200px;
        }

        .stats-overlay h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 1.1em;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .stat-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
        }

        .stat-value {
            font-weight: 600;
            color: #333;
            background: #f8f9fa;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .search-container {
            position: relative;
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 10px 40px 10px 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 0.9em;
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }

        .export-controls {
            padding: 15px 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            background: #f8f9fa;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close:hover {
            color: #000;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            z-index: 3000;
            animation: slideInRight 0.3s ease;
        }

        .notification.success {
            background: #28a745;
            color: white;
        }

        .notification.error {
            background: #dc3545;
            color: white;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 300px;
            }
            
            .stats-overlay {
                position: relative;
                margin: 10px;
                top: 0;
                right: 0;
            }
            
            .app-container {
                flex-direction: column;
            }
            
            .map-container {
                height: 60vh;
            }
        }

        /* Custom marker styles */
        .custom-marker {
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .custom-marker:hover {
            transform: scale(1.2);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <button class="sidebar-toggle" id="sidebarToggle">
                <i class="fas fa-chevron-left"></i>
            </button>
            
            <div class="header">
                <h1><i class="fas fa-map-marked-alt"></i> Life Milestones</h1>
                <p>Your personal journey mapped</p>
            </div>

            <div class="controls">
                <div class="search-container">
                    <input type="text" class="search-input" id="searchInput" placeholder="Search milestones...">
                    <i class="fas fa-search search-icon"></i>
                </div>

                <div class="control-group">
                    <label for="milestoneTitle">Milestone Title</label>
                    <div class="input-group">
                        <input type="text" id="milestoneTitle" placeholder="e.g., First Job at Google">
                    </div>
                </div>

                <div class="control-group">
                    <label for="milestoneCategory">Category</label>
                    <div class="input-group">
                        <select id="milestoneCategory">
                            <option value="career">Career</option>
                            <option value="education">Education</option>
                            <option value="travel">Travel</option>
                            <option value="relationship">Relationship</option>
                            <option value="achievement">Achievement</option>
                            <option value="home">Home</option>
                            <option value="health">Health & Fitness</option>
                            <option value="hobby">Hobby</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="control-group">
                    <label for="milestoneDate">Date</label>
                    <div class="input-group">
                        <input type="date" id="milestoneDate">
                    </div>
                </div>

                <div class="control-group">
                    <label for="milestoneLocation">Location</label>
                    <div class="input-group">
                        <input type="text" id="milestoneLocation" placeholder="City, Country or click on map">
                    </div>
                </div>

                <div class="control-group">
                    <label for="milestoneDescription">Description</label>
                    <div class="input-group">
                        <textarea id="milestoneDescription" placeholder="Tell the story behind this milestone..."></textarea>
                    </div>
                </div>

                <button class="btn btn-primary" id="addMilestone">
                    <i class="fas fa-plus"></i> Add Milestone
                </button>
            </div>

            <div class="filters">
                <div class="control-group">
                    <label>Filter by Category</label>
                    <div class="filter-chips" id="categoryFilters">
                        <div class="chip active" data-category="all">All</div>
                        <div class="chip" data-category="career">Career</div>
                        <div class="chip" data-category="education">Education</div>
                        <div class="chip" data-category="travel">Travel</div>
                        <div class="chip" data-category="relationship">Relationship</div>
                        <div class="chip" data-category="achievement">Achievement</div>
                        <div class="chip" data-category="home">Home</div>
                        <div class="chip" data-category="health">Health</div>
                        <div class="chip" data-category="hobby">Hobby</div>
                    </div>
                </div>

                <div class="timeline-filter">
                    <label>Timeline Filter</label>
                    <div class="year-range">
                        <div class="year-display" id="startYear">2015</div>
                        <input type="range" id="startYearSlider" min="2000" max="2025" value="2015">
                        <span>-</span>
                        <input type="range" id="endYearSlider" min="2000" max="2025" value="2025">
                        <div class="year-display" id="endYear">2025</div>
                    </div>
                </div>
            </div>

            <div class="milestones-list" id="milestonesList">
                <!-- Milestones will be populated here -->
            </div>

            <div class="export-controls">
                <div class="export-buttons">
                    <button class="btn btn-secondary btn-small" id="exportJSON">
                        <i class="fas fa-download"></i> JSON
                    </button>
                    <button class="btn btn-secondary btn-small" id="exportCSV">
                        <i class="fas fa-file-csv"></i> CSV
                    </button>
                    <button class="btn btn-secondary btn-small" id="importData">
                        <i class="fas fa-upload"></i> Import
                    </button>
                </div>
            </div>
        </div>

        <div class="map-container">
            <div id="map"></div>
            
            <div class="stats-overlay">
                <h3><i class="fas fa-chart-bar"></i> Statistics</h3>
                <div class="stat-item">
                    <span class="stat-label">Total Milestones</span>
                    <span class="stat-value" id="totalMilestones">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Countries Visited</span>
                    <span class="stat-value" id="countriesVisited">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Years Tracked</span>
                    <span class="stat-value" id="yearsTracked">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Most Active Year</span>
                    <span class="stat-value" id="mostActiveYear">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Milestone</h2>
                <span class="close" id="closeModal">&times;</span>
            </div>
            <div class="modal-body">
                <div class="control-group">
                    <label for="editTitle">Title</label>
                    <input type="text" id="editTitle" class="input-group">
                </div>
                <div class="control-group">
                    <label for="editCategory">Category</label>
                    <select id="editCategory" class="input-group">
                        <option value="career">Career</option>
                        <option value="education">Education</option>
                        <option value="travel">Travel</option>
                        <option value="relationship">Relationship</option>
                        <option value="achievement">Achievement</option>
                        <option value="home">Home</option>
                        <option value="health">Health & Fitness</option>
                        <option value="hobby">Hobby</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="editDate">Date</label>
                    <input type="date" id="editDate" class="input-group">
                </div>
                <div class="control-group">
                    <label for="editLocation">Location</label>
                    <input type="text" id="editLocation" class="input-group">
                </div>
                <div class="control-group">
                    <label for="editDescription">Description</label>
                    <textarea id="editDescription" class="input-group"></textarea>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button class="btn btn-primary" id="saveEdit">Save Changes</button>
                    <button class="btn btn-danger" id="deleteMilestone">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".json,.csv" style="display: none;">

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        class PersonalMilestonesMap {
            constructor() {
                this.map = null;
                this.milestones = [];
                this.markers = [];
                this.currentFilter = 'all';
                this.currentEditId = null;
                this.selectedLocation = null;
                this.startYear = 2015;
                this.endYear = 2025;
                
                this.categoryIcons = {
                    career: { icon: 'fa-briefcase', color: '#3498db' },
                    education: { icon: 'fa-graduation-cap', color: '#e74c3c' },
                    travel: { icon: 'fa-plane', color: '#f39c12' },
                    relationship: { icon: 'fa-heart', color: '#e91e63' },
                    achievement: { icon: 'fa-trophy', color: '#ffd700' },
                    home: { icon: 'fa-home', color: '#27ae60' },
                    health: { icon: 'fa-heartbeat', color: '#ff6b6b' },
                    hobby: { icon: 'fa-palette', color: '#9b59b6' },
                    other: { icon: 'fa-star', color: '#95a5a6' }
                };

                this.init();
                this.loadSampleData();
            }

            init() {
                this.initMap();
                this.initEventListeners();
                this.updateDisplay();
            }

            initMap() {
                this.map = L.map('map').setView([40.7128, -74.0060], 3);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(this.map);

                this.map.on('click', (e) => {
                    this.selectedLocation = e.latlng;
                    this.reverseGeocode(e.latlng);
                });
            }

            async reverseGeocode(latlng) {
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latlng.lat}&lon=${latlng.lng}&format=json`);
                    const data = await response.json();
                    const location = data.display_name.split(',');
                    const city = location[0].trim();
                    const country = location[location.length - 1].trim();
                    document.getElementById('milestoneLocation').value = `${city}, ${country}`;
                } catch (error) {
                    document.getElementById('milestoneLocation').value = `${latlng.lat.toFixed(4)}, ${latlng.lng.toFixed(4)}`;
                }
            }

            initEventListeners() {
                // Sidebar toggle
                document.getElementById('sidebarToggle').addEventListener('click', () => {
                    const sidebar = document.getElementById('sidebar');
                    const toggle = document.getElementById('sidebarToggle');
                    const icon = toggle.querySelector('i');
                    
                    sidebar.classList.toggle('collapsed');
                    icon.className = sidebar.classList.contains('collapsed') ? 'fas fa-chevron-right' : 'fas fa-chevron-left';
                });

                // Add milestone
                document.getElementById('addMilestone').addEventListener('click', () => {
                    this.addMilestone();
                });

                // Search
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.searchMilestones(e.target.value);
                });

                // Category filters
                document.getElementById('categoryFilters').addEventListener('click', (e) => {
                    if (e.target.classList.contains('chip')) {
                        document.querySelectorAll('.chip').forEach(chip => chip.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentFilter = e.target.dataset.category;
                        this.updateDisplay();
                    }
                });

                // Timeline sliders
                const startSlider = document.getElementById('startYearSlider');
                const endSlider = document.getElementById('endYearSlider');
                
                startSlider.addEventListener('input', (e) => {
                    this.startYear = parseInt(e.target.value);
                    document.getElementById('startYear').textContent = this.startYear;
                    if (this.startYear >= this.endYear) {
                        this.endYear = this.startYear + 1;
                        endSlider.value = this.endYear;
                        document.getElementById('endYear').textContent = this.endYear;
                    }
                    this.updateDisplay();
                });

                endSlider.addEventListener('input', (e) => {
                    this.endYear = parseInt(e.target.value);
                    document.getElementById('endYear').textContent = this.endYear;
                    if (this.endYear <= this.startYear) {
                        this.startYear = this.endYear - 1;
                        startSlider.value = this.startYear;
                        document.getElementById('startYear').textContent = this.startYear;
                    }
                    this.updateDisplay();
                });

                // Export functions
                document.getElementById('exportJSON').addEventListener('click', () => this.exportData('json'));
                document.getElementById('exportCSV').addEventListener('click', () => this.exportData('csv'));
                document.getElementById('importData').addEventListener('click', () => {
                    document.getElementById('fileInput').click();
                });

                document.getElementById('fileInput').addEventListener('change', (e) => {
                    this.importData(e.target.files[0]);
                });

                // Modal events
                document.getElementById('closeModal').addEventListener('click', () => this.closeModal());
                document.getElementById('saveEdit').addEventListener('click', () => this.saveEdit());
                document.getElementById('deleteMilestone').addEventListener('click', () => this.deleteMilestone());

                window.addEventListener('click', (e) => {
                    if (e.target === document.getElementById('editModal')) {
                        this.closeModal();
                    }
                });
            }

            async addMilestone() {
                const title = document.getElementById('milestoneTitle').value;
                const category = document.getElementById('milestoneCategory').value;
                const date = document.getElementById('milestoneDate').value;
                const location = document.getElementById('milestoneLocation').value;
                const description = document.getElementById('milestoneDescription').value;

                if (!title || !date || !location) {
                    this.showNotification('Please fill in all required fields', 'error');
                    return;
                }

                let coordinates = this.selectedLocation;
                if (!coordinates) {
                    coordinates = await this.geocode(location);
                    if (!coordinates) {
                        this.showNotification('Could not find location coordinates', 'error');
                        return;
                    }
                }

                const milestone = {
                    id: Date.now(),
                    title,
                    category,
                    date,
                    location,
                    description,
                    coordinates: [coordinates.lat, coordinates.lng],
                    createdAt: new Date().toISOString()
                };

                this.milestones.push(milestone);
                this.clearForm();
                this.updateDisplay();
                this.showNotification('Milestone added successfully!', 'success');
            }

            async geocode(location) {
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(location)}&format=json&limit=1`);
                    const data = await response.json();
                    if (data.length > 0) {
                        return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
                    }
                } catch (error) {
                    console.error('Geocoding error:', error);
                }
                return null;
            }

            clearForm() {
                document.getElementById('milestoneTitle').value = '';
                document.getElementById('milestoneDate').value = '';
                document.getElementById('milestoneLocation').value = '';
                document.getElementById('milestoneDescription').value = '';
                document.getElementById('milestoneCategory').value = 'career';
                this.selectedLocation = null;
            }

            updateDisplay() {
                this.updateMap();
                this.updateMilestonesList();
                this.updateStats();
            }

            updateMap() {
                // Clear existing markers
                this.markers.forEach(marker => this.map.removeLayer(marker));
                this.markers = [];

                // Filter milestones
                const filteredMilestones = this.getFilteredMilestones();

                // Add markers for filtered milestones
                filteredMilestones.forEach(milestone => {
                    const categoryInfo = this.categoryIcons[milestone.category];
                    
                    // Create custom marker
                    const markerIcon = L.divIcon({
                        className: 'custom-marker',
                        html: `<div class="custom-marker" style="background-color: ${categoryInfo.color}; width: 40px; height: 40px;">
                                   <i class="fas ${categoryInfo.icon}"></i>
                               </div>`,
                        iconSize: [40, 40],
                        iconAnchor: [20, 20]
                    });

                    const marker = L.marker(milestone.coordinates, { icon: markerIcon })
                        .addTo(this.map);

                    // Create popup content
                    const popupContent = `
                        <div style="min-width: 200px;">
                            <h3 style="margin: 0 0 10px 0; color: ${categoryInfo.color};">
                                <i class="fas ${categoryInfo.icon}"></i> ${milestone.title}
                            </h3>
                            <p style="margin: 0 0 5px 0;"><strong>Date:</strong> ${new Date(milestone.date).toLocaleDateString()}</p>
                            <p style="margin: 0 0 5px 0;"><strong>Location:</strong> ${milestone.location}</p>
                            <p style="margin: 0 0 10px 0;"><strong>Category:</strong> ${milestone.category}</p>
                            ${milestone.description ? `<p style="margin: 0;"><strong>Description:</strong> ${milestone.description}</p>` : ''}
                            <div style="margin-top: 10px;">
                                <button onclick="app.editMilestone(${milestone.id})" style="background: #007bff; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-right: 5px;">Edit</button>
                            </div>
                        </div>
                    `;

                    marker.bindPopup(popupContent);
                    this.markers.push(marker);
                });

                // Fit map to show all markers if there are any
                if (this.markers.length > 0) {
                    const group = new L.featureGroup(this.markers);
                    this.map.fitBounds(group.getBounds().pad(0.1));
                }
            }

            updateMilestonesList() {
                const listContainer = document.getElementById('milestonesList');
                const filteredMilestones = this.getFilteredMilestones();

                if (filteredMilestones.length === 0) {
                    listContainer.innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">No milestones found matching your criteria.</div>';
                    return;
                }

                // Sort milestones by date (most recent first)
                filteredMilestones.sort((a, b) => new Date(b.date) - new Date(a.date));

                listContainer.innerHTML = filteredMilestones.map(milestone => {
                    const categoryInfo = this.categoryIcons[milestone.category];
                    return `
                        <div class="milestone-item" onclick="app.focusOnMilestone(${milestone.id})">
                            <div class="milestone-header">
                                <div class="milestone-icon" style="background-color: ${categoryInfo.color};">
                                    <i class="fas ${categoryInfo.icon}"></i>
                                </div>
                                <div class="milestone-content" style="flex: 1;">
                                    <h4>${milestone.title}</h4>
                                    <div class="milestone-meta">
                                        <span><i class="fas fa-calendar"></i> ${new Date(milestone.date).toLocaleDateString()}</span>
                                        <span><i class="fas fa-map-marker-alt"></i> ${milestone.location}</span>
                                    </div>
                                    ${milestone.description ? `<div class="milestone-description">${milestone.description}</div>` : ''}
                                </div>
                            </div>
                            <div class="milestone-actions">
                                <button class="btn btn-secondary btn-small" onclick="event.stopPropagation(); app.editMilestone(${milestone.id})">
                                    <i class="fas fa-edit"></i> Edit
                                </button>
                                <button class="btn btn-danger btn-small" onclick="event.stopPropagation(); app.confirmDelete(${milestone.id})">
                                    <i class="fas fa-trash"></i> Delete
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            updateStats() {
                const totalMilestones = this.milestones.length;
                const countries = [...new Set(this.milestones.map(m => m.location.split(',').pop().trim()))];
                const years = [...new Set(this.milestones.map(m => new Date(m.date).getFullYear()))];
                
                // Find most active year
                const yearCounts = {};
                this.milestones.forEach(m => {
                    const year = new Date(m.date).getFullYear();
                    yearCounts[year] = (yearCounts[year] || 0) + 1;
                });
                
                const mostActiveYear = Object.keys(yearCounts).reduce((a, b) => 
                    yearCounts[a] > yearCounts[b] ? a : b, '-'
                );

                document.getElementById('totalMilestones').textContent = totalMilestones;
                document.getElementById('countriesVisited').textContent = countries.length;
                document.getElementById('yearsTracked').textContent = years.length;
                document.getElementById('mostActiveYear').textContent = mostActiveYear;
            }

            getFilteredMilestones() {
                return this.milestones.filter(milestone => {
                    // Category filter
                    if (this.currentFilter !== 'all' && milestone.category !== this.currentFilter) {
                        return false;
                    }

                    // Date range filter
                    const milestoneYear = new Date(milestone.date).getFullYear();
                    if (milestoneYear < this.startYear || milestoneYear > this.endYear) {
                        return false;
                    }

                    // Search filter
                    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                    if (searchTerm) {
                        const searchableText = `${milestone.title} ${milestone.location} ${milestone.description} ${milestone.category}`.toLowerCase();
                        if (!searchableText.includes(searchTerm)) {
                            return false;
                        }
                    }

                    return true;
                });
            }

            searchMilestones(searchTerm) {
                this.updateDisplay();
            }

            focusOnMilestone(id) {
                const milestone = this.milestones.find(m => m.id === id);
                if (milestone) {
                    this.map.setView(milestone.coordinates, 10);
                    const marker = this.markers.find(marker => {
                        const markerLatLng = marker.getLatLng();
                        return Math.abs(markerLatLng.lat - milestone.coordinates[0]) < 0.001 && 
                               Math.abs(markerLatLng.lng - milestone.coordinates[1]) < 0.001;
                    });
                    if (marker) {
                        marker.openPopup();
                    }
                }
            }

            editMilestone(id) {
                const milestone = this.milestones.find(m => m.id === id);
                if (milestone) {
                    this.currentEditId = id;
                    document.getElementById('editTitle').value = milestone.title;
                    document.getElementById('editCategory').value = milestone.category;
                    document.getElementById('editDate').value = milestone.date;
                    document.getElementById('editLocation').value = milestone.location;
                    document.getElementById('editDescription').value = milestone.description || '';
                    document.getElementById('editModal').style.display = 'block';
                }
            }

            saveEdit() {
                if (!this.currentEditId) return;

                const milestone = this.milestones.find(m => m.id === this.currentEditId);
                if (milestone) {
                    milestone.title = document.getElementById('editTitle').value;
                    milestone.category = document.getElementById('editCategory').value;
                    milestone.date = document.getElementById('editDate').value;
                    milestone.location = document.getElementById('editLocation').value;
                    milestone.description = document.getElementById('editDescription').value;
                    
                    this.updateDisplay();
                    this.closeModal();
                    this.showNotification('Milestone updated successfully!', 'success');
                }
            }

            confirmDelete(id) {
                if (confirm('Are you sure you want to delete this milestone? This action cannot be undone.')) {
                    this.milestones = this.milestones.filter(m => m.id !== id);
                    this.updateDisplay();
                    this.showNotification('Milestone deleted successfully!', 'success');
                }
            }

            deleteMilestone() {
                if (this.currentEditId && confirm('Are you sure you want to delete this milestone? This action cannot be undone.')) {
                    this.milestones = this.milestones.filter(m => m.id !== this.currentEditId);
                    this.updateDisplay();
                    this.closeModal();
                    this.showNotification('Milestone deleted successfully!', 'success');
                }
            }

            closeModal() {
                document.getElementById('editModal').style.display = 'none';
                this.currentEditId = null;
            }

            exportData(format) {
                if (this.milestones.length === 0) {
                    this.showNotification('No milestones to export!', 'error');
                    return;
                }

                let dataStr;
                let filename;

                if (format === 'json') {
                    dataStr = JSON.stringify(this.milestones, null, 2);
                    filename = 'milestones.json';
                } else if (format === 'csv') {
                    const headers = ['Title', 'Category', 'Date', 'Location', 'Description', 'Latitude', 'Longitude'];
                    const csvContent = [
                        headers.join(','),
                        ...this.milestones.map(m => [
                            `"${m.title}"`,
                            m.category,
                            m.date,
                            `"${m.location}"`,
                            `"${m.description || ''}"`,
                            m.coordinates[0],
                            m.coordinates[1]
                        ].join(','))
                    ].join('\n');
                    dataStr = csvContent;
                    filename = 'milestones.csv';
                }

                const blob = new Blob([dataStr], { type: format === 'json' ? 'application/json' : 'text/csv' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                this.showNotification(`Data exported as ${filename}`, 'success');
            }

            async importData(file) {
                if (!file) return;

                const text = await file.text();
                try {
                    let importedData;
                    
                    if (file.name.endsWith('.json')) {
                        importedData = JSON.parse(text);
                    } else if (file.name.endsWith('.csv')) {
                        // Simple CSV parsing
                        const lines = text.split('\n');
                        const headers = lines[0].split(',').map(h => h.replace(/"/g, ''));
                        importedData = lines.slice(1).filter(line => line.trim()).map(line => {
                            const values = line.split(',').map(v => v.replace(/"/g, ''));
                            return {
                                id: Date.now() + Math.random(),
                                title: values[0],
                                category: values[1],
                                date: values[2],
                                location: values[3],
                                description: values[4],
                                coordinates: [parseFloat(values[5]), parseFloat(values[6])],
                                createdAt: new Date().toISOString()
                            };
                        });
                    }

                    if (importedData && Array.isArray(importedData)) {
                        this.milestones = [...this.milestones, ...importedData];
                        this.updateDisplay();
                        this.showNotification(`Imported ${importedData.length} milestones!`, 'success');
                    }
                } catch (error) {
                    this.showNotification('Error importing data. Please check file format.', 'error');
                }
            }

            showNotification(message, type) {
                const notification = document.createElement('div');
                notification.className = `notification ${type}`;
                notification.innerHTML = `
                    <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
                    ${message}
                `;
                document.body.appendChild(notification);

                setTimeout(() => {
                    notification.remove();
                }, 3000);
            }

                const sampleMilestones = [

                this.milestones = sampleMilestones;
                this.updateDisplay();
            }
        }

        // Initialize the application
        const app = new PersonalMilestonesMap();

        // Make app globally accessible for onclick handlers
        window.app = app;
    </script>
