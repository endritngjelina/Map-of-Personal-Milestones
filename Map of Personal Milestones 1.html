<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Milestones - Life Journey Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            height: 100vh;
        }

        .app-container {
            display: flex;
            height: 100vh;
            backdrop-filter: blur(10px);
        }

        .sidebar {
            width: 350px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .sidebar-header {
            padding: 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
        }

        .sidebar-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .sidebar-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .controls-section {
            padding: 20px;
            border-bottom: 1px solid #e5e5e7;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-label {
            font-size: 14px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 8px;
            display: block;
        }

        .add-milestone-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .add-milestone-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .timeline-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .filter-btn {
            padding: 6px 12px;
            border: 2px solid #e5e5e7;
            background: white;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .category-filters {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .category-btn {
            padding: 8px;
            border: 2px solid #e5e5e7;
            background: white;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .category-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .milestones-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 20px;
        }

        .milestone-item {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #e5e5e7;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .milestone-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .milestone-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .milestone-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
        }

        .milestone-title {
            font-weight: 600;
            color: #1d1d1f;
            font-size: 16px;
        }

        .milestone-date {
            font-size: 12px;
            color: #86868b;
        }

        .milestone-description {
            font-size: 14px;
            color: #424245;
            margin-top: 8px;
        }

        .milestone-location {
            font-size: 12px;
            color: #86868b;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #ff3b30;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .milestone-item:hover .delete-btn {
            opacity: 1;
        }

        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 32px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-size: 24px;
            color: #1d1d1f;
            margin-bottom: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e5e7;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .location-input {
            position: relative;
        }

        .location-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #e5e5e7;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .location-suggestion {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #f5f5f7;
        }

        .location-suggestion:hover {
            background: #f5f5f7;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f7;
            color: #1d1d1f;
        }

        .btn-secondary:hover {
            background: #e5e5e7;
        }

        .stats-section {
            padding: 20px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            border-top: 1px solid #e5e5e7;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .stat-item {
            text-align: center;
            padding: 12px;
            background: white;
            border-radius: 8px;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #86868b;
            margin-top: 4px;
        }

        .map-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .map-control-btn {
            width: 48px;
            height: 48px;
            background: white;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #1d1d1f;
            transition: all 0.3s ease;
        }

        .map-control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: 50vh;
            }
            
            .map-container {
                height: 50vh;
            }
        }

        .pulse-animation {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.7;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .leaflet-popup-content-wrapper {
            border-radius: 12px;
        }

        .custom-popup {
            text-align: center;
            padding: 8px;
        }

        .popup-title {
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 4px;
        }

        .popup-date {
            font-size: 12px;
            color: #86868b;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>Life Journey</h1>
                <p>Map your personal milestones</p>
            </div>
            
            <div class="controls-section">
                <div class="control-group">
                    <button class="add-milestone-btn" id="addMilestoneBtn">
                        <i class="fas fa-plus"></i>
                        Add New Milestone
                    </button>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Timeline Filters</label>
                    <div class="timeline-filters">
                        <button class="filter-btn active" data-period="all">All Time</button>
                        <button class="filter-btn" data-period="year">This Year</button>
                        <button class="filter-btn" data-period="5years">Last 5 Years</button>
                        <button class="filter-btn" data-period="decade">Last Decade</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Categories</label>
                    <div class="category-filters">
                        <button class="category-btn active" data-category="all">All</button>
                        <button class="category-btn" data-category="career">Career</button>
                        <button class="category-btn" data-category="education">Education</button>
                        <button class="category-btn" data-category="travel">Travel</button>
                        <button class="category-btn" data-category="personal">Personal</button>
                        <button class="category-btn" data-category="achievement">Achievement</button>
                    </div>
                </div>
            </div>
            
            <div class="milestones-list" id="milestonesList">
                <!-- Milestones will be populated here -->
            </div>
            
            <div class="stats-section">
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-number" id="totalMilestones">0</div>
                        <div class="stat-label">Total Milestones</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="countriesVisited">0</div>
                        <div class="stat-label">Countries</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="thisYearCount">0</div>
                        <div class="stat-label">This Year</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="averagePerYear">0</div>
                        <div class="stat-label">Avg/Year</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="map-container">
            <div id="map"></div>
            <div class="map-controls">
                <button class="map-control-btn" id="centerMapBtn" title="Center Map">
                    <i class="fas fa-crosshairs"></i>
                </button>
                <button class="map-control-btn" id="fullscreenBtn" title="Fullscreen">
                    <i class="fas fa-expand"></i>
                </button>
                <button class="map-control-btn" id="exportBtn" title="Export Data">
                    <i class="fas fa-download"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Add Milestone Modal -->
    <div id="milestoneModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Milestone</h2>
                <p>Create a memory that matters</p>
            </div>
            
            <form id="milestoneForm">
                <div class="form-group">
                    <label for="milestoneTitle">Title *</label>
                    <input type="text" id="milestoneTitle" required placeholder="e.g., First Job at Apple">
                </div>
                
                <div class="form-group">
                    <label for="milestoneCategory">Category *</label>
                    <select id="milestoneCategory" required>
                        <option value="">Select a category</option>
                        <option value="career">Career</option>
                        <option value="education">Education</option>
                        <option value="travel">Travel</option>
                        <option value="personal">Personal</option>
                        <option value="achievement">Achievement</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="milestoneDate">Date *</label>
                    <input type="date" id="milestoneDate" required>
                </div>
                
                <div class="form-group">
                    <label for="milestoneLocation">Location *</label>
                    <div class="location-input">
                        <input type="text" id="milestoneLocation" required placeholder="e.g., Cupertino, California">
                        <div class="location-suggestions" id="locationSuggestions"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="milestoneDescription">Description</label>
                    <textarea id="milestoneDescription" placeholder="Share your story..."></textarea>
                </div>
                
                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Milestone</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        class MilestoneMap {
            constructor() {
                this.milestones = JSON.parse(localStorage.getItem('milestones') || '[]');
                this.map = null;
                this.markers = new Map();
                this.activeFilters = {
                    period: 'all',
                    category: 'all'
                };
                
                this.categoryIcons = {
                    career: { icon: 'fas fa-briefcase', color: '#667eea' },
                    education: { icon: 'fas fa-graduation-cap', color: '#764ba2' },
                    travel: { icon: 'fas fa-plane', color: '#f093fb' },
                    personal: { icon: 'fas fa-heart', color: '#ff6b6b' },
                    achievement: { icon: 'fas fa-trophy', color: '#feca57' }
                };
                
                this.init();
            }
            
            init() {
                this.initMap();
                this.initEventListeners();
                this.renderMilestones();
                this.updateStats();
                this.loadSampleData();
            }
            
            initMap() {
                this.map = L.map('map', {
                    zoomControl: false
                }).setView([20, 0], 2);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    maxZoom: 18
                }).addTo(this.map);
                
                L.control.zoom({
                    position: 'bottomright'
                }).addTo(this.map);
            }
            
            initEventListeners() {
                // Add milestone button
                document.getElementById('addMilestoneBtn').addEventListener('click', () => {
                    this.showModal();
                });
                
                // Modal events
                document.getElementById('cancelBtn').addEventListener('click', () => {
                    this.hideModal();
                });
                
                document.getElementById('milestoneForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.addMilestone();
                });
                
                // Filter events
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.activeFilters.period = e.target.dataset.period;
                        this.applyFilters();
                    });
                });
                
                document.querySelectorAll('.category-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.activeFilters.category = e.target.dataset.category;
                        this.applyFilters();
                    });
                });
                
                // Location input with suggestions
                document.getElementById('milestoneLocation').addEventListener('input', (e) => {
                    this.searchLocations(e.target.value);
                });
                
                // Map controls
                document.getElementById('centerMapBtn').addEventListener('click', () => {
                    this.centerMap();
                });
                
                document.getElementById('fullscreenBtn').addEventListener('click', () => {
                    this.toggleFullscreen();
                });
                
                document.getElementById('exportBtn').addEventListener('click', () => {
                    this.exportData();
                });
                
                // Close modal on outside click
                document.getElementById('milestoneModal').addEventListener('click', (e) => {
                    if (e.target.id === 'milestoneModal') {
                        this.hideModal();
                    }
                });
            }
            
            showModal() {
                document.getElementById('milestoneModal').style.display = 'block';
                document.getElementById('milestoneTitle').focus();
            }
            
            hideModal() {
                document.getElementById('milestoneModal').style.display = 'none';
                document.getElementById('milestoneForm').reset();
                this.hideSuggestions();
            }
            
            async addMilestone() {
                const formData = new FormData(document.getElementById('milestoneForm'));
                const title = document.getElementById('milestoneTitle').value;
                const category = document.getElementById('milestoneCategory').value;
                const date = document.getElementById('milestoneDate').value;
                const location = document.getElementById('milestoneLocation').value;
                const description = document.getElementById('milestoneDescription').value;
                
                try {
                    const coords = await this.geocodeLocation(location);
                    
                    const milestone = {
                        id: Date.now().toString(),
                        title,
                        category,
                        date,
                        location,
                        description,
                        coordinates: coords,
                        createdAt: new Date().toISOString()
                    };
                    
                    this.milestones.push(milestone);
                    this.saveMilestones();
                    this.renderMilestones();
                    this.updateStats();
                    this.addMarker(milestone);
                    this.hideModal();
                    
                    // Animate to new marker
                    this.map.flyTo(coords, 8, {
                        animate: true,
                        duration: 1.5
                    });
                    
                } catch (error) {
                    alert('Could not find location. Please try a different address.');
                }
            }
            
            async geocodeLocation(location) {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(location)}&limit=1`);
                const data = await response.json();
                
                if (data && data.length > 0) {
                    return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                } else {
                    throw new Error('Location not found');
                }
            }
            
            async searchLocations(query) {
                if (query.length < 3) {
                    this.hideSuggestions();
                    return;
                }
                
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`);
                    const suggestions = await response.json();
                    this.showSuggestions(suggestions);
                } catch (error) {
                    this.hideSuggestions();
                }
            }
            
            showSuggestions(suggestions) {
                const container = document.getElementById('locationSuggestions');
                container.innerHTML = '';
                
                if (suggestions.length === 0) {
                    this.hideSuggestions();
                    return;
                }
                
                suggestions.forEach(suggestion => {
                    const div = document.createElement('div');
                    div.className = 'location-suggestion';
                    div.textContent = suggestion.display_name;
                    div.addEventListener('click', () => {
                        document.getElementById('milestoneLocation').value = suggestion.display_name;
                        this.hideSuggestions();
                    });
                    container.appendChild(div);
                });
                
                container.style.display = 'block';
            }
            
            hideSuggestions() {
                document.getElementById('locationSuggestions').style.display = 'none';
            }
            
            renderMilestones() {
                const container = document.getElementById('milestonesList');
                const filteredMilestones = this.getFilteredMilestones();
                
                container.innerHTML = '';
                
                filteredMilestones.forEach(milestone => {
                    const item = this.createMilestoneItem(milestone);
                    container.appendChild(item);
                });
                
                this.updateMapMarkers();
            }
            
            createMilestoneItem(milestone) {
                const div = document.createElement('div');
                div.className = 'milestone-item';
                
                const categoryInfo = this.categoryIcons[milestone.category];
                const date = new Date(milestone.date);
                
                div.innerHTML = `
                    <div class="milestone-header">
                        <div class="milestone-icon" style="background: ${categoryInfo.color}">
                            <i class="${categoryInfo.icon}"></i>
                        </div>
                        <div>
                            <div class="milestone-title">${milestone.title}</div>
                            <div class="milestone-date">${date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
                        </div>
                    </div>
                    ${milestone.description ? `<div class="milestone-description">${milestone.description}</div>` : ''}
                    <div class="milestone-location">
                        <i class="fas fa-map-marker-alt"></i>
                        ${milestone.location}
                    </div>
                    <button class="delete-btn" onclick="milestoneApp.deleteMilestone('${milestone.id}')">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                
                div.addEventListener('click', (e) => {
                    if (!e.target.closest('.delete-btn')) {
                        this.flyToMilestone(milestone);
                    }
                });
                
                return div;
            }
            
            getFilteredMilestones() {
                let filtered = [...this.milestones];
                
                // Apply period filter
                if (this.activeFilters.period !== 'all') {
                    const now = new Date();
                    const cutoff = new Date();
                    
                    switch (this.activeFilters.period) {
                        case 'year':
                            cutoff.setFullYear(now.getFullYear() - 1);
                            break;
                        case '5years':
                            cutoff.setFullYear(now.getFullYear() - 5);
                            break;
                        case 'decade':
                            cutoff.setFullYear(now.getFullYear() - 10);
                            break;
                    }
                    
                    filtered = filtered.filter(m => new Date(m.date) >= cutoff);
                }
                
                // Apply category filter
                if (this.activeFilters.category !== 'all') {
                    filtered = filtered.filter(m => m.category === this.activeFilters.category);
                }
                
                // Sort by date (newest first)
                filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                return filtered;
            }
            
            applyFilters() {
                this.renderMilestones();
                this.updateStats();
            }
            
            updateMapMarkers() {
                // Clear existing markers
                this.markers.forEach(marker => {
                    this.map.removeLayer(marker);
                });
                this.markers.clear();
                
                // Add filtered markers
                const filteredMilestones = this.getFilteredMilestones();
                filteredMilestones.forEach(milestone => {
                    this.addMarker(milestone);
                });
            }
            
            addMarker(milestone) {
                const categoryInfo = this.categoryIcons[milestone.category];
                
                // Create custom icon
                const customIcon = L.divIcon({
                    className: 'custom-marker',
                    html: `
                        <div style="
                            width: 40px; 
                            height: 40px; 
                            background: ${categoryInfo.color}; 
                            border-radius: 50%; 
                            display: flex; 
                            align-items: center; 
                            justify-content: center; 
                            color: white; 
                            font-size: 16px;
                            border: 3px solid white;
                            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
                        ">
                            <i class="${categoryInfo.icon}"></i>
                        </div>
                    `,
                    iconSize: [40, 40],
                    iconAnchor: [20, 20]
                });
                
                const marker = L.marker(milestone.coordinates, { 
                    icon: customIcon 
                }).addTo(this.map);
                
                // Create popup content
                const popupContent = `
                    <div class="custom-popup">
                        <div class="popup-title">${milestone.title}</div>
                        <div class="popup-date">${new Date(milestone.date).toLocaleDateString()}</div>
                        ${milestone.description ? `<div style="margin-top: 8px; font-size: 12px; color: #424245;">${milestone.description}</div>` : ''}
                    </div>
                `;
                
                marker.bindPopup(popupContent, {
                    closeButton: true,
                    autoClose: false,
                    className: 'custom-popup-wrapper'
                });
                
                // Add click animation
                marker.on('click', () => {
                    marker.getElement().classList.add('pulse-animation');
                    setTimeout(() => {
                        marker.getElement().classList.remove('pulse-animation');
                    }, 2000);
                });
                
                this.markers.set(milestone.id, marker);
            }
            
            flyToMilestone(milestone) {
                this.map.flyTo(milestone.coordinates, 12, {
                    animate: true,
                    duration: 1.5
                });
                
                const marker = this.markers.get(milestone.id);
                if (marker) {
                    marker.openPopup();
                    marker.getElement().classList.add('pulse-animation');
                    setTimeout(() => {
                        marker.getElement().classList.remove('pulse-animation');
                    }, 2000);
                }
            }
            
            deleteMilestone(id) {
                if (confirm('Are you sure you want to delete this milestone?')) {
                    // Remove from array
                    this.milestones = this.milestones.filter(m => m.id !== id);
                    
                    // Remove marker from map
                    const marker = this.markers.get(id);
                    if (marker) {
                        this.map.removeLayer(marker);
                        this.markers.delete(id);
                    }
                    
                    this.saveMilestones();
                    this.renderMilestones();
                    this.updateStats();
                }
            }
            
            centerMap() {
                if (this.milestones.length === 0) {
                    this.map.setView([20, 0], 2);
                    return;
                }
                
                const filteredMilestones = this.getFilteredMilestones();
                if (filteredMilestones.length === 0) {
                    this.map.setView([20, 0], 2);
                    return;
                }
                
                const group = new L.featureGroup(
                    filteredMilestones.map(m => this.markers.get(m.id)).filter(Boolean)
                );
                
                this.map.fitBounds(group.getBounds().pad(0.1), {
                    animate: true,
                    duration: 1.5
                });
            }
            
            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                    document.getElementById('fullscreenBtn').innerHTML = '<i class="fas fa-compress"></i>';
                } else {
                    document.exitFullscreen();
                    document.getElementById('fullscreenBtn').innerHTML = '<i class="fas fa-expand"></i>';
                }
            }
            
            exportData() {
                const data = {
                    milestones: this.milestones,
                    exportDate: new Date().toISOString(),
                    version: '1.0'
                };
                
                const blob = new Blob([JSON.stringify(data, null, 2)], {
                    type: 'application/json'
                });
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `milestones-${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            
            updateStats() {
                const total = this.milestones.length;
                const filtered = this.getFilteredMilestones();
                
                // Countries visited
                const countries = new Set();
                this.milestones.forEach(m => {
                    const locationParts = m.location.split(',');
                    if (locationParts.length > 0) {
                        countries.add(locationParts[locationParts.length - 1].trim());
                    }
                });
                
                // This year count
                const thisYear = new Date().getFullYear();
                const thisYearMilestones = this.milestones.filter(m => 
                    new Date(m.date).getFullYear() === thisYear
                );
                
                // Average per year
                const years = new Set(this.milestones.map(m => 
                    new Date(m.date).getFullYear()
                ));
                const averagePerYear = years.size > 0 ? Math.round(total / years.size) : 0;
                
                document.getElementById('totalMilestones').textContent = total;
                document.getElementById('countriesVisited').textContent = countries.size;
                document.getElementById('thisYearCount').textContent = thisYearMilestones.length;
                document.getElementById('averagePerYear').textContent = averagePerYear;
            }
            
            saveMilestones() {
                localStorage.setItem('milestones', JSON.stringify(this.milestones));
            }
            
            loadSampleData() {
                if (this.milestones.length === 0) {
                    const sampleMilestones = [
                        {
                            id: '1',
                            title: 'Started at Apple',
                            category: 'career',
                            date: '2023-06-15',
                            location: 'Cupertino, California, USA',
                            description: 'Joined the iOS development team - dream job achieved!',
                            coordinates: [37.3229978, -122.0321823],
                            createdAt: new Date().toISOString()
                        },
                        {
                            id: '2',
                            title: 'Graduated Stanford',
                            category: 'education',
                            date: '2023-05-20',
                            location: 'Stanford, California, USA',
                            description: 'Computer Science degree completed with honors',
                            coordinates: [37.4274745, -122.169719],
                            createdAt: new Date().toISOString()
                        },
                        {
                            id: '3',
                            title: 'European Adventure',
                            category: 'travel',
                            date: '2022-08-10',
                            location: 'Paris, France',
                            description: 'Amazing month-long backpacking trip across Europe',
                            coordinates: [48.8566969, 2.3514616],
                            createdAt: new Date().toISOString()
                        },
                        {
                            id: '4',
                            title: 'First App Published',
                            category: 'achievement',
                            date: '2022-03-12',
                            location: 'San Francisco, California, USA',
                            description: 'My first iOS app reached #1 in productivity category',
                            coordinates: [37.7792588, -122.4193286],
                            createdAt: new Date().toISOString()
                        }
                    ];
                    
                    this.milestones = sampleMilestones;
                    this.saveMilestones();
                    this.renderMilestones();
                    this.updateStats();
                    
                    // Add markers for sample data
                    sampleMilestones.forEach(milestone => {
                        this.addMarker(milestone);
                    });
                }
            }
        }
        
        // Initialize the application
        const milestoneApp = new MilestoneMap();
        
        // Handle fullscreen changes
        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById('fullscreenBtn');
            if (document.fullscreenElement) {
                btn.innerHTML = '<i class="fas fa-compress"></i>';
            } else {
                btn.innerHTML = '<i class="fas fa-expand"></i>';
            }
        });
        
        // Handle window resize for map
        window.addEventListener('resize', () => {
            setTimeout(() => {
                milestoneApp.map.invalidateSize();
            }, 100);
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                milestoneApp.hideModal();
            }
            if (e.ctrlKey || e.metaKey) {
                switch (e.key) {
                    case 'n':
                        e.preventDefault();
                        milestoneApp.showModal();
                        break;
                    case 'f':
                        e.preventDefault();
                        milestoneApp.toggleFullscreen();
                        break;
                    case 'c':
                        e.preventDefault();
                        milestoneApp.centerMap();
                        break;
                }
            }
        });
    </script>
</body>
</html>
